<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King Khalid University</title>

    <!-- CSS Files And CDNs-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <!-- Header -->
    <div id="profile-header"></div>

    <!-- MOBILE TOGGLE BUTTON -->
    <button class="sidebar-toggle d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
        <i class="fa-solid fa-bars"></i>
        <span class="mx-3" style="font-weight: 600;">القائمة</span>
    </button>

    <div class="dashboard-layout">
        <!-- SIDEBAR -->
        <div id="sidebarContainer"></div>

        <!-- CONTENT -->
        <main class="content-area">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#">الملف الشخصي</a></li>
                    <li class="breadcrumb-item"><a href="#">لوحة التحكم</a></li>
                    <li class="breadcrumb-item active" aria-current="page">طلباتي</li>
                </ol>
            </nav>

            <section class="my-orders-profile">
                <div class="my-orders">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>الرقم المرجعي</th>
                                <th>المبلغ</th>
                                <th>التاريخ</th>
                                <th>حالة الطلب</th>
                                <th>طلبك</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>REF12345</td>
                                <td>500 ريال</td>
                                <td>16-11-2025</td>
                                <td>مكتمل</td>
                                <td>تفاصيل</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>REF12346</td>
                                <td>300 ريال</td>
                                <td>15-11-2025</td>
                                <td>قيد الانتظار</td>
                                <td>تفاصيل</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>REF12347</td>
                                <td>450 ريال</td>
                                <td>14-11-2025</td>
                                <td>ملغى</td>
                                <td>تفاصيل</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <!-- Load Header & Sidebar -->
    <script>
        $(function () {
            $("#profile-header").load("partials/profile-header.html");
            $("#sidebarContainer").load("partials/sidebar.html", function () {
                // Set active state based on current page
                const currentPage = window.location.pathname.split('/').pop() || 'dashboard.html';
                const menuItems = document.querySelectorAll(".menu-list li.menu-item");

                // Find and activate the matching menu item
                menuItems.forEach(item => {
                    const pageName = item.getAttribute('data-page');
                    if (pageName === currentPage || (currentPage === '' && pageName === 'dashboard.html')) {
                        item.classList.add('active');
                    }
                });

                // Also check dropdown items
                const dropdownItems = document.querySelectorAll(".dropdown-menu .dropdown-item");
                dropdownItems.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href === currentPage) {
                        link.classList.add('active');
                    }
                });
            });
        });
    </script>

    <script src="assets/js/main.js"></script>
</body>

</html>
